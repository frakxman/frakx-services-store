<div class="relative min-h-screen bg-canvas overflow-x-hidden">
  <div class="pointer-events-none absolute -top-40 -left-32 w-[32rem] h-[32rem] rounded-full bg-brand-700/20 blur-3xl"></div>
  <div class="pointer-events-none absolute top-1/3 -right-40 w-[28rem] h-[28rem] rounded-full bg-brand-600/15 blur-3xl"></div>
  <div class="relative container mx-auto p-4">
    <app-header />
    <div class="flex space-x-4 mt-5">
      <div class="w-40">
        <ul class="flex flex-col gap-2">
          <li *ngFor="let link of links, index as i">
            <a [routerLink]="link.path" class="block text-white/70 hover:text-white hover:bg-white/5 rounded-lg px-3 py-2 transition-colors">
              {{link.label}}
            </a>
          </li>
        </ul>
      </div>
      <div class="w-full" *ngIf="router.url === '/admin'; else options">
        <div class="rounded-2xl border border-white/15 bg-glass backdrop-blur-xl p-8 flex items-center justify-center">
          <img
            src="../../../../../assets/logo/logo.jpg"
            alt="Logo"
            class="rounded-lg max-h-64"
          >
        </div>
      </div>
      <ng-template #options>
        <div class="w-full">
          <router-outlet />
        </div>
      </ng-template>
    </div>
  </div>
</div>
