<div class="rounded-2xl border border-white/15 bg-glass backdrop-blur-xl shadow-lg overflow-auto">
  <table class="table-auto w-full text-white">
    <thead>
      <tr class="border-b border-white/15">
        <th class="px-4 py-3"></th>
        <th class="px-4 py-3 text-left text-xs uppercase tracking-wider text-white/60">
          Name
        </th>
        <th class="px-4 py-3 text-center text-xs uppercase tracking-wider text-white/60">
          Actions
        </th>
      </tr>
    </thead>

    <tbody>
      <tr
        *ngFor="let category of categories()"
        class="border-b border-white/10 last:border-b-0 hover:bg-white/5 transition-colors"
      >
        <td class="px-4 py-3">
          <img
            [src]="category.image ? category.image : 'assets/logo/noImage.jpg'"
            [alt]="category.name"
            class="w-8 h-8 rounded-md object-cover border border-white/15"
          >
        </td>

        <td class="px-4 py-3 font-medium">
          {{ category.name }}
        </td>

        <td class="px-4 py-3 text-center">
          <div class="flex justify-center items-center gap-2">

            <!-- Edit -->
            <button
              class="bg-white/10 hover:bg-white/15 text-white p-2 rounded-lg border border-white/15 transition-colors"
            >
              <svg
                class="w-3 h-3"
                aria-hidden="true"
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                fill="none"
                viewBox="0 0 24 24"
              >
                <path
                  stroke="currentColor"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="m14.304 4.844 2.852 2.852M7 7H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1v-4.5m2.409-9.91a2.017 2.017 0 0 1 0 2.853l-6.844 6.844L8 14l.713-3.565 6.844-6.844a2.015 2.015 0 0 1 2.852 0Z"
                />
              </svg>
            </button>

            <!-- Delete -->
            <button
              class="bg-brand-700/20 hover:bg-brand-700/40 text-brand-400 p-2 rounded-lg border border-brand-700/30 transition-colors"
            >
              <svg
                class="w-3 h-3"
                aria-hidden="true"
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                fill="none"
                viewBox="0 0 24 24"
              >
                <path
                  stroke="currentColor"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M5 7h14m-9 3v8m4-8v8M10 3h4a1 1 0 0 1 1 1v3H9V4a1 1 0 0 1 1-1ZM6 7h12v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V7Z"
                />
              </svg>
            </button>

          </div>
        </td>
      </tr>
    </tbody>
  </table>
</div>
