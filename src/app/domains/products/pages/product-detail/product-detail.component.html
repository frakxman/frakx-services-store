<div class="container mx-auto p-4">
  <a
    routerLink="/"
    class="inline-flex items-center gap-1.5 text-white/70 hover:text-white mb-6 text-sm font-medium transition-colors"
  >
    <svg class="w-4 h-4" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" />
    </svg>
    Back to shop
 </a>
  <div class="flex flex-col md:flex-row space-y-10 md:space-y-0 md:space-x-10">
    <div class="flex flex-col w-full md:w-1/3">
      <div class="w-full rounded-2xl border border-white/15 bg-glass backdrop-blur-xl overflow-hidden">
        <img
          alt="product image"
          class="w-full object-cover object-center aspect-square"
          [src]="cover() ? cover() : 'assets/logo/noImage.jpg'"
        />
      </div>
      <div class="flex items-center justify-center mt-3">
        <div class="grid grid-cols-3 gap-2">
          @for (img of product()?.images; track img; let i = $index) {
            <img
              alt="product image"
              class="object-cover object-center rounded-lg border-2 border-white/15 cursor-pointer"
              [src]="img ? img : 'assets/logo/noImage.jpg'"
              (click)="changeCover(img)"
              [class.border-brand-500]="img === cover()"
            />
          }
        </div>
      </div>
    </div>

    <div class="mt-5 w-full">
      <h1 class="text-white text-3xl title-font font-medium mb-1">
        {{ product()?.name }}
      </h1>
      <p class="leading-relaxed text-white/60">
        {{ product()?.description }}
      </p>
      <p class="title-font font-semibold text-2xl text-white mt-5">
        {{ product()?.price | currency:'$':'symbol':'1.0' }}
      </p>
      <button
        class="flex font-semibold bg-brand-700 hover:bg-brand-800 border-0 p-2 mt-10 transition-colors duration-300 ease-in-out focus:ring-2 focus:ring-brand-500 focus:outline-none text-sm px-5 py-2.5 text-center text-white rounded-lg"
        (click)="addToCart()"
        >
        Add To Cart
      </button>
    </div>
  </div>
</div>
