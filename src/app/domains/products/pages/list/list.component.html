<div class="container mx-auto p-4">
  <div class="flex flex-col md:flex-row space-y-4 md:space-y-0 md:space-x-4 mt-5">
    <div class="md:w-1/4">
      <div class="flex flex-col gap-3">
        <button
          (click)="selectCategory(null)"
          [class.bg-brand-700]="selectedCategoryId() === null"
          [class.border-brand-500]="selectedCategoryId() === null"
          class="text-white bg-white/5 hover:bg-white/10 border border-white/15 font-medium rounded-lg text-sm px-5 py-2.5 w-full transition-colors"
        >
          All
        </button>
        <button
          *ngFor="let category of categs(); let i = index"
          (click)="selectCategory(category.id)"
          [class.bg-brand-700]="selectedCategoryId() === category.id"
          [class.border-brand-500]="selectedCategoryId() === category.id"
          class="text-white bg-white/5 hover:bg-white/10 border border-white/15 font-medium rounded-lg text-sm px-5 py-2.5 w-full transition-colors"
        >
          {{ category.name }}
        </button>
      </div>
    </div>
    <div class="md:w-3/4">
      <div class="grid grid-cols-1 sm:grid-cols-3 md:grid-cols-4 gap-4">
        @for (product of prods(); track $index) {
          <app-product [product]="product" (addToCart)="addToCart( $event )" />
        }
      </div>
    </div>
  </div>
</div>
