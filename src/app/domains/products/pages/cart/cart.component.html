<div class="relative max-w-4xl mx-auto px-4 py-10">
  <div *ngIf="cart().length === 0" class="flex flex-col items-center justify-center h-[80vh] text-center">
    <h1 class="text-2xl font-semibold text-white mb-4">Your cart is empty.</h1>
    <a routerLink="/" type="button" class="px-5 py-2.5 bg-brand-700 hover:bg-brand-800 text-white font-medium rounded-lg shadow-lg transition-colors" >Return to shop</a>
  </div>
  <div *ngIf="cart().length > 0" >
    <h1 class="text-2xl font-semibold text-white mb-4">Your Cart</h1>
    <app-table />
    <div class="flex justify-between items-center mt-4 p-4 rounded-2xl bg-brand-700 shadow-lg border-t border-white/20">
      <p class="font-medium text-white">TOTAL</p>
      <span class="text-xl font-semibold text-white">{{ total() | currency:'$':'symbol':'1.0' }}</span>
    </div>
    <div *ngIf="!logged" class="flex justify-end mt-6">
      <button  (click)="userConfirm()" class="bg-white/10 hover:bg-white/15 text-white font-semibold p-2.5 px-5 rounded-lg border border-white/15 backdrop-blur-md transition-colors" >
        Proceed to Checkout
      </button>
    </div>
    <div *ngIf="logged && !checkoutStarted" class="flex justify-end mt-6">
      <button  (click)="startCheckout()" class="bg-brand-700 hover:bg-brand-800 text-white font-semibold p-2.5 px-5 rounded-lg shadow-lg transition-colors" >
        Purchase
      </button>
    </div>
    <div *ngIf="logged && checkoutStarted && step === 0">
      <app-customer-data (customerData)="onLocation($event)" />
    </div>
    <div *ngIf="logged && checkoutStarted && step === 1">
      <app-pay-methods (paymentData)="onPayMethod($event)" />
    </div>
    <div *ngIf="logged && checkoutStarted && showModal">
      <div class="fixed z-10 inset-0 overflow-y-auto flex items-center justify-center p-4" aria-labelledby="modal-title" role="dialog" aria-modal="true">
        <div class="fixed inset-0 bg-black/70 backdrop-blur-sm transition-opacity" aria-hidden="true"></div>
        <div class="relative rounded-2xl border border-white/15 bg-glass backdrop-blur-xl text-left overflow-hidden shadow-2xl transform transition-all sm:w-full sm:max-w-2xl">
          <!-- Head -->
          <div class="bg-white/5 font-semibold px-4 py-5 border-b border-white/15 sm:px-6">
            <h3 class="text-lg leading-6 font-medium text-white" id="modal-title">
              Order Details
            </h3>
          </div>
          <!-- Body -->
          <div class="px-4 pt-5 pb-4 sm:p-6 sm:pb-4 w-full">
            <div class="sm:flex sm:items-start w-full">
              <div class="mt-3 text-center sm:mt-0 sm:text-left w-full">
                <div class="flex flex-wrap w-full">
                  <dl class="flex-1 mr-2">
                    <label for="locationName" class="block text-sm font-medium text-white/60">Name</label>
                    <input id="locationName" type="text" readonly class="mt-1 block w-full py-2 px-3 border border-white/15 bg-white/5 text-white rounded-md focus:outline-none sm:text-sm" [value]="orderData.locationData.name">
                  </dl>
                  <dl class="flex-1 ml-2">
                    <label for="locationAddress" class="block text-sm font-medium text-white/60">Address</label>
                    <input id="locationAddress" type="text" readonly class="mt-1 block w-full py-2 px-3 border border-white/15 bg-white/5 text-white rounded-md focus:outline-none sm:text-sm" [value]="orderData.locationData.address">
                  </dl>
                </div>
                <div class="flex flex-wrap mt-3">
                  <dl class="flex-1 mr-2">
                    <label for="locationPhone" class="block text-sm font-medium text-white/60">Phone</label>
                    <input id="locationPhone" type="text" readonly class="mt-1 block w-full py-2 px-3 border border-white/15 bg-white/5 text-white rounded-md focus:outline-none sm:text-sm" [value]="orderData.locationData.phone">
                  </dl>
                  <dl class="flex-1 mr-2">
                    <label for="locationTotal" class="block text-sm font-medium text-white/60">Total</label>
                    <input id="locationTotal" type="text" readonly class="mt-1 block w-full py-2 px-3 border border-white/15 bg-white/5 text-white rounded-md focus:outline-none sm:text-sm" [value]="orderData.total">
                  </dl>
                </div>
                <div class="flex flex-wrap mt-3">
                  <dl class="flex-1 mr-2">
                    <label class="block text-sm font-medium text-white/60">Products</label>
                    <div *ngFor="let product of orderData.products" class="mt-1">
                      <p class="block w-full py-2 px-3 border border-white/15 bg-white/5 text-white rounded-md sm:text-sm text-center">
                        {{ product.name }} - Quantity: {{ product.quantity }}
                      </p>
                    </div>
                  </dl>
                </div>
              </div>
            </div>
          </div>
          <!-- Actions -->
          <div class="bg-white/5 px-4 py-3 sm:px-6 sm:flex sm:justify-between border-t border-white/15">
            <button type="button" class="w-full inline-flex justify-center rounded-lg border border-transparent shadow-sm px-4 py-2 bg-brand-700 hover:bg-brand-800 text-base font-medium text-white focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-canvas focus:ring-brand-500 sm:w-auto sm:text-sm transition-colors" (click)="confirmOrder()">
              Confirm Order
            </button>
            <button type="button" class="mt-3 w-full inline-flex justify-center rounded-lg border border-white/15 shadow-sm px-4 py-2 bg-white/5 hover:bg-white/10 text-base font-medium text-white focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-canvas focus:ring-brand-500 sm:mt-0 sm:w-auto sm:text-sm transition-colors" (click)="closeModal()">
              Cancel
            </button>
          </div>
        </div>
      </div>
    </div>
    <div *ngIf="confirmationModal">
      <div class="fixed z-10 inset-0 overflow-y-auto flex items-center justify-center p-4" aria-labelledby="modal-title" role="dialog" aria-modal="true">
        <div class="fixed inset-0 bg-black/70 backdrop-blur-sm transition-opacity" aria-hidden="true"></div>
        <div class="relative rounded-2xl border border-white/15 bg-glass backdrop-blur-xl text-center overflow-hidden shadow-2xl transform transition-all sm:w-full sm:max-w-2xl">
          <!-- Head -->
          <div class="bg-white/5 font-semibold px-4 py-5 border-b border-white/15 sm:px-6">
            <h3 class="text-2xl leading-6 font-medium text-white" id="modal-title">
              Order Confirmation
            </h3>
          </div>
          <!-- Body -->
          <div class="px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
            <p class="text-lg text-white/90">Order generated with number: <span class="text-brand-500 font-semibold">{{ orderNumber }}</span></p>
          </div>
          <!-- Actions -->
          <div class="bg-white/5 px-4 py-3 sm:px-6 sm:flex sm:justify-center border-t border-white/15">
            <button type="button" class="w-full inline-flex justify-center rounded-lg border border-transparent shadow-sm px-4 py-2 bg-brand-700 hover:bg-brand-800 text-lg font-medium text-white focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-canvas focus:ring-brand-500 sm:w-auto sm:text-sm transition-colors" (click)="closeConfirmationModal()">
              Close
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
