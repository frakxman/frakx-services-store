<section class="w-full">
  <div class="p-4 w-full h-full md:h-auto">
    <!-- Content -->
    <div class="p-4 rounded-2xl border border-white/15 bg-glass backdrop-blur-xl shadow-lg sm:p-5">
      <!-- Header -->
      <div class="flex justify-between items-center pb-4 mb-4 border-b border-white/15">
        <h3 class="text-lg font-semibold text-white">
          {{ router.url === '/admin/create' ? 'Add' : 'Edit' }} Product
        </h3>
      </div>
      <!-- Body -->
      <form [formGroup]="productForm" (ngSubmit)="onSubmit()">
        <div class="grid gap-4 mb-4 sm:grid-cols-2">
          <!-- Name -->
          <div>
            <label for="name" class="block mb-2 text-sm font-medium text-white/80">
              Name
            </label>
            <input
              type="text"
              name="name"
              id="name"
              formControlName="name"
              class="bg-white/5 border border-white/15 text-white text-sm rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500 block w-full p-2.5 placeholder-white/40"
              placeholder="Type product name"
            >
            <div *ngIf="productForm.controls['name'].invalid && productForm.controls['name'].touched" class="text-brand-400 text-sm mt-1">
                <div *ngIf="productForm.controls['name'].errors?.['required']">
                Name is required.
              </div>
              <div *ngIf="productForm.controls['name'].errors?.['minlength']">
                Name must be at least 3 characters long.
              </div>
            </div>
          </div>
          <!-- Price -->
          <div>
            <label for="price" class="block mb-2 text-sm font-medium text-white/80">
              Price
            </label>
            <input
              type="number"
              name="price"
              id="price"
              formControlName="price"
              class="bg-white/5 border border-white/15 text-white text-sm rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500 block w-full p-2.5 placeholder-white/40"
              placeholder="$2999"
            >
            <div *ngIf="productForm.controls['price'].invalid && productForm.controls['price'].touched" class="text-brand-400 text-sm mt-1">
              <div *ngIf="productForm.controls['price'].errors?.['required']">
                Price is required.
              </div>
              <div *ngIf="productForm.controls['price'].errors?.['min']">
                Price must be greater than 0.
              </div>
            </div>
          </div>
          <!-- Category -->
          <div>
            <label for="category" class="block mb-2 text-sm font-medium text-white/80">
              Category
            </label>
            <select
              name="category"
              id="category"
              formControlName="categoryId"
              class="bg-white/5 border border-white/15 text-white text-sm rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500 block w-full p-2.5"
            >
                <option value="">Select a category</option>
                @for (category of categs(); track category.id) {
                  <option [value]="category.id">
                    {{ category.name }}
                  </option>
                }
            </select>
          </div>
          <!-- Stock -->
          <div>
            <label for="stock" class="block mb-2 text-sm font-medium text-white/80">
              Stock
            </label>
            <input
              type="number"
              name="stock"
              id="stock"
              formControlName="stock"
              class="bg-white/5 border border-white/15 text-white text-sm rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500 block w-full p-2.5 placeholder-white/40"
              placeholder="10"
            >
            <div *ngIf="productForm.controls['stock'].invalid && productForm.controls['stock'].touched" class="text-brand-400 text-sm mt-1">
              <div *ngIf="productForm.controls['stock'].errors?.['required']">
                Stock is required.
              </div>
              <div *ngIf="productForm.controls['stock'].errors?.['min']">
                Stock must be greater than 0.
              </div>
            </div>
          </div>
          <!-- Description -->
          <div class="sm:col-span-2">
            <label for="description" class="block mb-2 text-sm font-medium text-white/80">Description</label>
            <textarea
              name="description"
              id="description"
              formControlName="description"
              rows="4"
              class="block p-2.5 w-full text-sm text-white bg-white/5 rounded-lg border border-white/15 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500 placeholder-white/40"
              placeholder="Write product description here"
            ></textarea>
            <div *ngIf="productForm.controls['description'].invalid && productForm.controls['description'].touched" class="text-brand-400 text-sm mt-1">
              <div *ngIf="productForm.controls['description'].errors?.['required']">
                Description is required.
              </div>
              <div *ngIf="productForm.controls['description'].errors?.['minlength']">
                Description must be at least 10 characters long.
              </div>
            </div>
          </div>
        </div>
        <!-- Available for purchase -->
        <div class="flex items-center gap-2 mb-4">
          <input
            type="checkbox"
            name="status"
            id="status"
            formControlName="status"
            class="w-4 h-4 rounded border border-white/20 bg-white/5 focus:ring-2 focus:ring-brand-500 accent-brand-600"
          >
          <label for="status" class="text-sm font-medium text-white/80">
            Available for purchase
          </label>
        </div>
        <!-- Image -->
        <div>
          <label class="block mb-2 text-sm font-medium text-white/80" for="file_input">
            Upload file
          </label>
          <input
            class="block py-2 px-2 w-full text-sm text-white/60 border border-white/15 rounded-lg cursor-pointer bg-white/5 focus:outline-none"
            id="file_input"
            type="file"
            readonly
            disabled
          >
        </div>
        <!-- Submit -->
        <button
          type="submit"
          class="mt-5 inline-flex items-center bg-brand-700 hover:bg-brand-800 focus:ring-2 focus:outline-none focus:ring-brand-500 font-medium rounded-lg text-sm px-5 py-2.5 text-center text-white transition-colors"
        >
          <svg class="mr-1 -ml-1 w-6 h-6" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
            <path fill-rule="evenodd" d="M10 5a1 1 0 011 1v3h3a1 1 0 110 2h-3v3a1 1 0 11-2 0v-3H6a1 1 0 110-2h3V6a1 1 0 011-1z" clip-rule="evenodd">
            </path>
          </svg>
          {{ router.url === '/admin/create' ? 'Add' : 'Edit' }} Product
        </button>
      </form>
    </div>
  </div>
</section>
