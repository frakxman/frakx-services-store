<div class="group rounded-2xl border border-white/15 bg-[#241318]/80 overflow-hidden hover:border-brand-500/40 transition-colors">
  <a [routerLink]="['/products', product.id]" class="w-full overflow-hidden bg-white/5 block aspect-square">
      <img
        [src]="product.images[0] ? product.images[0] : 'assets/logo/noImage.jpg'"
        [alt]="product.name"
        class="h-full w-full object-cover object-center group-hover:opacity-80 transition-opacity"
      >
  </a>
  <div class="flex flex-col space-y-2 p-4">
      <div class="flex items-center justify-between">
        <h3 class="text-sm text-white/70">{{ product.name | titlecase }}</h3>
        <span *ngIf="product.status === false" class="text-[10px] uppercase tracking-wide text-white/40 border border-white/15 rounded px-1.5 py-0.5">
          Not available
        </span>
      </div>
      <p class="text-lg font-semibold text-white">{{ product.price | currency:'$':'symbol':'1.0' }}</p>
      <p class="text-sm text-white/50">{{ product.description | slice:0:35 }}...</p>
      <button *ngIf="product.status !== false; else disabledButton" class="text-white bg-brand-700 hover:bg-brand-800 font-medium rounded-lg text-sm px-5 py-2.5 w-full transition-colors" (click)="addCart()">
          Add to cart
      </button>
      <ng-template #disabledButton>
        <button disabled class="text-white/40 bg-white/5 border border-white/10 font-medium rounded-lg text-sm px-5 py-2.5 w-full cursor-not-allowed">
            Not available
        </button>
      </ng-template>
  </div>
</div>
