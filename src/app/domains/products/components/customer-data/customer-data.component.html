<section class="w-full mt-6">
  <div class="rounded-2xl border border-white/15 bg-glass backdrop-blur-xl shadow-lg p-5">
    <!-- Header -->
    <div class="flex justify-center items-center pb-4 mb-4 border-b border-white/15">
      <h3 class="text-2xl font-semibold text-white">
        Checkout
      </h3>
    </div>
    <!-- Body -->
    <form [formGroup]="checkoutForm" (ngSubmit)="onSubmit()">
      <div class="grid gap-4 mb-4 sm:grid-cols-2">
        <!-- Name -->
        <div>
          <label for="name" class="block mb-2 text-sm font-medium text-white/80">
            Name
          </label>
          <input
            type="text"
            name="name"
            id="name"
            formControlName="name"
            class="bg-white/5 border border-white/15 text-white text-sm rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500 block w-full p-2.5 placeholder-white/40"
            placeholder="Type your name"
          >
        </div>
        <!-- Email -->
        <div>
          <label for="email" class="block mb-2 text-sm font-medium text-white/80">
            Email
          </label>
          <input
            type="email"
            name="email"
            id="email"
            formControlName="email"
            class="bg-white/5 border border-white/15 text-white text-sm rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500 block w-full p-2.5 placeholder-white/40"
            placeholder="Type your email"
          >
        </div>
        <!-- Address -->
        <div>
            <label for="address" class="block mb-2 text-sm font-medium text-white/80">
                Address
            </label>
            <input
                type="text"
                name="address"
                id="address"
                formControlName="address"
                class="bg-white/5 border border-white/15 text-white text-sm rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500 block w-full p-2.5 placeholder-white/40"
                placeholder="Type your address"
            >
        </div>
        <!-- Phone -->
        <div>
          <label for="phone" class="block mb-2 text-sm font-medium text-white/80">
            Phone
          </label>
          <input
            type="tel"
            name="phone"
            id="phone"
            formControlName="phone"
            class="bg-white/5 border border-white/15 text-white text-sm rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500 block w-full p-2.5 placeholder-white/40"
            placeholder="Type your phone number"
          >
        </div>
      </div>
      <!-- Submit -->
      <button
        type="submit"
        class="mt-2 inline-flex items-center bg-brand-700 hover:bg-brand-800 focus:ring-2 focus:ring-brand-500 focus:outline-none font-medium rounded-lg text-sm px-5 py-2.5 text-white transition-colors"
      >
        <svg class="mr-1 -ml-1 w-6 h-6" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
          <path fill-rule="evenodd" d="M10 5a1 1 0 011 1v3h3a1 1 0 110 2h-3v3a1 1 0 11-2 0v-3H6a1 1 0 110-2h3V6a1 1 0 011-1z" clip-rule="evenodd">
          </path>
        </svg>
        Continue
      </button>
    </form>
  </div>
</section>
