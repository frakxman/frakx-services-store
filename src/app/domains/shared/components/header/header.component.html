<div class="relative container mx-auto p-4">
  <!-- Navbar  -->
  <nav>
    <div class="w-full flex flex-col sm:flex-row items-center justify-between mx-auto py-4">
      <div class="flex items-center space-x-8 mb-4 sm:mb-0">
        <a
          class="flex items-center"
          routerLink="/"
          routerLinkActive="border-b-2 border-brand-500"
          [routerLinkActiveOptions]="{ exact: true }"
          aria-current="page"
        >
          <img
            src="../../../../../assets/logo/logo.jpg"
            width="24"
            height="24"
            class="h-6 mr-3 rounded"
            alt="company logo"
          />
          <span class="self-center text-xl font-semibold whitespace-nowrap text-white">
            Frakx Services Store
          </span>
        </a>
      </div>
      <div *ngIf="user" class="flex items-center mb-4 sm:mb-0">
        <span class="mr-2 text-white/80">Welcome, {{ user | titlecase }}</span>
        <button class="ml-2 bg-white/10 hover:bg-white/15 border border-white/15 rounded-lg px-2 py-1.5 transition-colors" (click)="logout()">
          <svg class="w-3 h-3 text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 18 16">
            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M1 8h11m0 0L8 4m4 4-4 4m4-11h3a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-3"/>
          </svg>
        </button>
      </div>
      <div class="flex items-center">
        <button class="p-2 border border-white/15 bg-white/5 hover:bg-white/10 rounded-lg relative transition-colors" (click)="toggleSideMenu()">
          <div class="absolute -top-2 -right-2 rounded-full h-5 w-5 flex items-center justify-center bg-brand-700 text-white text-xs">
            {{ prodsTotal() }}
          </div>
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="w-6 h-6 text-white"
            >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437M7.5 14.25a3 3 0 00-3 3h15.75m-12.75-3h11.218c1.121-2.3 2.1-4.684 2.924-7.138a60.114 60.114 0 00-16.536-1.84M7.5 14.25L5.106 5.272M6 20.25a.75.75 0 11-1.5 0 .75.75 0 011.5 0zm12.75 0a.75.75 0 11-1.5 0 .75.75 0 011.5 0z"
              />
            </svg>
          </button>
        </div>
    </div>
  </nav>
  <!-- Cart  -->
  <div class="fixed border-l border-white/15 top-0 right-0 z-40 w-full max-w-lg h-screen p-4 overflow-y-auto transition-transform bg-glass backdrop-blur-xl" [class.translate-x-full]="hideSideMenu()">
      <div class="flex justify-between items-center">
        <p class="text-xl text-white font-semibold">My Cart</p>
        <button (click)="toggleSideMenu()" class="mt-[-10px] lg:mt-0 text-white/70 hover:text-white transition-colors">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="w-6 h-6"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M6 18L18 6M6 6l12 12"
            />
          </svg>
        </button>
      </div>
      <div *ngIf="cart().length === 0" class="flex flex-col items-center justify-center h-[60vh] text-center">
        <svg class="w-10 h-10 text-white/30 mb-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437M7.5 14.25a3 3 0 00-3 3h15.75m-12.75-3h11.218c1.121-2.3 2.1-4.684 2.924-7.138a60.114 60.114 0 00-16.536-1.84M7.5 14.25L5.106 5.272M6 20.25a.75.75 0 11-1.5 0 .75.75 0 011.5 0zm12.75 0a.75.75 0 11-1.5 0 .75.75 0 011.5 0z" />
        </svg>
        <p class="text-white/60">No products in your cart yet.</p>
      </div>

      <ng-container *ngIf="cart().length > 0">
        <app-table />
        <button class="text-white bg-brand-700 hover:bg-brand-800 font-medium rounded-lg text-sm py-2.5 px-4 fixed bottom-4 right-4 lg:right-10 transition-colors" (click)="goToCart()">
          Go to Cart
        </button>
      </ng-container>
    </div>
  </div>
