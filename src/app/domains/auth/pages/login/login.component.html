<section class="relative">
  <div class="flex flex-col items-center justify-center px-6 py-8 mx-auto md:h-screen lg:py-0">
    <a href="/" class="mb-6 text-2xl font-semibold flex flex-col items-center">
      <img class="w-20 h-20" src="assets/logo/logo.jpg" alt="logo">
      <p class="text-white mt-2">Frakx Services Store</p>
    </a>
    <div class="w-full rounded-2xl border border-white/15 bg-glass backdrop-blur-xl shadow-lg md:mt-0 sm:max-w-md xl:p-0">
      <div class="p-6 space-y-4 md:space-y-6 sm:p-8">
        <h1 class="text-xl font-bold leading-tight tracking-tight text-white md:text-2xl">
            Sign in to your account
        </h1>
        <form [formGroup]="loginForm" class="space-y-4 md:space-y-6" (ngSubmit)="onLogin()">
          <div>
            <label for="email" class="block mb-2 text-sm font-medium text-white/80">
              Your email
            </label>
            <input
              type="email"
              name="email"
              id="email"
              formControlName="email"
              class="bg-white/5 border border-white/15 text-white sm:text-sm rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500 block w-full p-2.5 placeholder-white/40"
              placeholder="name@company.com"
            >
            <div *ngIf="loginForm.get('email')?.errors && loginForm.get('email')?.touched">
              <p class="text-brand-400 mt-1 text-sm">Please enter a valid email.</p>
            </div>
          </div>
          <div>
            <label for="password" class="block mb-2 text-sm font-medium text-white/80">
              Password
            </label>
            <input
              type="password"
              name="password"
              id="password"
              formControlName="password"
              placeholder="••••••••"
              class="bg-white/5 border border-white/15 text-white sm:text-sm rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500 block w-full p-2.5 placeholder-white/40"
            >
            <div *ngIf="loginForm.get('password')?.errors && loginForm.get('password')?.touched">
              <p class="text-brand-400 mt-1 text-sm">Please enter a valid password.</p>
            </div>
          </div>
          <div class="flex items-center justify-between">
            <div class="flex items-start">
              <div class="flex items-center h-5">
                <input id="remember" aria-describedby="remember" type="checkbox" class="w-4 h-4 border border-white/20 rounded bg-white/5 focus:ring-2 focus:ring-brand-500" required="">
              </div>
              <div class="ml-3 text-sm">
                <label for="remember" class="text-white/60">Remember me</label>
              </div>
            </div>
            <a href="#" class="text-sm font-medium text-brand-400 hover:text-brand-300 hover:underline">Forgot password?</a>
          </div>
          <button type="submit" class="w-full text-white bg-brand-700 hover:bg-brand-800 focus:ring-2 focus:outline-none focus:ring-brand-500 font-medium rounded-lg text-sm px-5 py-2.5 text-center transition-colors">
            Sign in
          </button>
          <div class="flex flex-col items-center justify-center">
            <p class="text-sm font-light text-white/60">
              Don't have an account yet?
              <a routerLink="/auth/register" class="font-medium text-brand-400 hover:text-brand-300 hover:underline">
                Sign up
              </a>
            </p>
          </div>
        </form>
      </div>
    </div>
  </div>
</section>
